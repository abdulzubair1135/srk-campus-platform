name: teacher_app
description: Faculty Application for Timetable, Class Management, Dynamic QR & Realtime Attendance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  cryptography: ^2.7.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  campus_dart_core:
    path: ../../packages/dart_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
