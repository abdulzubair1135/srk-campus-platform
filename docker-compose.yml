version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: campus_mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: campus_coordination_db
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/campus_coordination_db
      - JWT_SECRET=super_secret_access_jwt_key_campus_presence_2026_change_in_prod
      - JWT_REFRESH_SECRET=super_secret_refresh_jwt_key_campus_presence_2026_change_in_prod
    depends_on:
      - mongodb

volumes:
  mongo_data:
